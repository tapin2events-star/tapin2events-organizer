# Publishes TapIN to Cloudflare Pages (direct upload) every time the site branch updates.
# GitHub Pages keeps publishing from this same branch too, as a ready backup.
name: Publish to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare the site files
        # Leave out GitHub-only files: 404.html (GitHub's workaround; Cloudflare serves the app for every page) and CNAME.
        run: |
          mkdir -p site
          rsync -a --exclude .git --exclude .github --exclude site --exclude 404.html --exclude CNAME ./ site/
      - name: Create the Cloudflare project (first run only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.114.0 pages project create tapin2events --production-branch main || echo "Project already exists"
      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3.114.0 pages deploy site --project-name tapin2events --branch main --commit-dirty=true
