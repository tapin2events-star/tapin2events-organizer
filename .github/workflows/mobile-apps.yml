# TapIN2Events phone apps (Capacitor): cloud builds on GitHub's computers, so no Mac or Android Studio is needed.
# Runs on the capacitor branch (and on demand).
#  - Android: an app bundle (.aab) signed with TapIN's upload key (GitHub secrets ANDROID_KEYSTORE_BASE64 and
#    ANDROID_KEYSTORE_PASSWORD), ready to upload to Google Play. The log shows the key's SHA-1 fingerprint (public), to
#    match the one Google Play approved. Without the secrets, it makes a test build instead.
name: Mobile apps

on:
  push:
    branches: [capacitor]
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Web build
        run: npm run build
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Upload key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then echo "signed=false" >> "$GITHUB_OUTPUT"; echo "No signing secrets: making a test build."; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "Upload key SHA-1 (should match Google Play's): $(keytool -list -v -keystore "$RUNNER_TEMP/upload.jks" -alias upload -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -m1 'SHA1:' | sed 's/.*SHA1: //')"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build the signed app bundle (Google Play)
        if: steps.key.outputs.signed == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - name: Build a test app (no signing secrets)
        if: steps.key.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v5
        if: steps.key.outputs.signed == 'true'
        with:
          name: tapin-android-app-bundle
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
      - uses: actions/upload-artifact@v5
        if: steps.key.outputs.signed != 'true'
        with:
          name: tapin-android-test-build
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

  ios:
    name: iPhone (TestFlight)
    runs-on: macos-latest
    timeout-minutes: 60
    # iPhone builds: signed automatically with TapIN's App Store Connect API key (GitHub secrets APPSTORE_KEY_ID,
    # APPSTORE_ISSUER_ID, APPSTORE_KEY_P8) for the Apple team in APPLE_TEAM_ID, then uploaded to TestFlight.
    steps:
      - name: Check secrets
        id: ready
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$P8" ] && [ -n "$TEAM" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "iPhone build skipped: add APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_KEY_P8 and APPLE_TEAM_ID."; fi
      - uses: actions/checkout@v5
        if: steps.ready.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install and sync
        if: steps.ready.outputs.ok == 'true'
        run: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Build, sign and upload to TestFlight
        if: steps.ready.outputs.ok == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          KEYFILE="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s\n' "$P8" > "$KEYFILE"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEYFILE -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive $AUTH \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=$((100 + BUILD_NUMBER)) | tail -n 40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH | tail -n 40
          echo "Uploaded build $((100 + BUILD_NUMBER)) (version 4.0.0) to App Store Connect. It appears in TestFlight after Apple processes it (usually 5-30 minutes)."
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
