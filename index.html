<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Home Screen app: opens full screen with its own icon and name -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TapIN" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <style>
      html, body { background: #ffffff; margin: 0; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #ffffff; }
      #boot span { font: 800 30px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; letter-spacing: -0.5px;
        background: linear-gradient(135deg, #4F46E5, #14B8A6); -webkit-background-clip: text; background-clip: text; color: transparent; opacity: 0.9; }
    </style>
    <!-- iPhone Safari: "Open in the TapIN app" banner (Get, if not installed). app-argument = the page being viewed. -->
    <meta name="apple-itunes-app" content="app-id=6474884074" />
    <script>
      (function () {
        try {
          var m = document.querySelector('meta[name="apple-itunes-app"]');
          if (m) m.setAttribute('content', 'app-id=6474884074, app-argument=' + location.href);
        } catch (e) {}
      })();
    </script>
    <title>TapIN2Events</title>
    <meta name="description" content="Find events, get tickets, and discover what's happening near you." />
    <meta property="og:site_name" content="TapIN2Events" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TapIN2Events" />
    <meta property="og:description" content="Find events, get tickets, and discover what's happening near you." />
    <meta property="og:image" content="https://app.tapin2events.com/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TapIN2Events" />
    <meta name="twitter:description" content="Find events, get tickets, and discover what's happening near you." />
    <meta name="twitter:image" content="https://app.tapin2events.com/og-default.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><div id="boot" aria-hidden="true"><span>TapIN</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
